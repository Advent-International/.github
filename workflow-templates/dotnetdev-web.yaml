name: x Dev Build Release Pipeline  # Replace x with App name
run-name: x dev build/release by @${{ github.actor }} # Replace x with App name
on:
  workflow_dispatch:
env:
  appName: # Add App name abbreviation here, e.g. iacm, pcap
  appRegion: # uksouth or eastus2
  appRegionShort: #eastus2 is eus2
  appSubscription: #azure sub to deploy to i.e sub-applications-dev
  dotnetVersion: #dotnet version '10.0.x'
  workingDirectory: #source of dotnet code src/Lpxr.Web

jobs:
  build_release:
    runs-on: adv-linux-eastus2
    env:
      workingDirectory: # Add name of directory with code here
    steps:
    - name: Azure Login 
      uses: Advent-International/cloudengineering-actions/release_auth_dev@main
      with :
        subscription: "${{ env.appSubscription }}"
        akvName: "${{ secrets.CLOUDOPS_AKV }}"
        akvAuth: "${{ secrets.CLOUDOPS_AKVAUTH }}"

    - name: Clear Extra Git Auth Headers
      uses: Advent-International/cloudengineering-actions/git_clear_extra_headers@main

    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🔵 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.dotnetVersion }}

    - name: 🏗️ Build and Publish Web App
      working-directory: ${{ env.workingDirectory }}
      run: dotnet publish --output publish_output --configuration Release

    - name: 📦 Zip Build Artifact
      working-directory: ${{ env.workingDirectory }}
      run: |
        cd publish_output
        zip -r ${{ github.run_id }}.zip .
        echo "Created deployment package: ${{ github.run_id }}.zip"
        ls -lh ${{ github.run_id }}.zip

    - name: 🚀 Deploy to Azure Web App (${{matrix.environment}})
      working-directory: ${{ env.workingDirectory }}
      run: |
        az webapp deploy \
          --resource-group rg-${{ env.appName }}-${{ env.appRegion }}-dev \
          --name app-${{ env.appName }}-${{ env.appRegion }}-dev-1 \
          --src-path publish_output/${{ github.run_id }}.zip \
          --type zip


